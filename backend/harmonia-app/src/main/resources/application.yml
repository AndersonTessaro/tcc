spring:
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 51MB
  application:
    name: harmonia
  datasource:
    url: jdbc:postgresql://localhost:5432/harmonia
    username: harmonia
    password: harmonia
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  docker:
    compose:
      # Resolved against the working dir, which is harmonia-app/ under spring-boot:run and the IDE.
      file: ../../docker-compose.yml

server:
  tomcat:
    max-swallow-size: 60MB

app:
  rsa:
    private-key: classpath:certs/private.pem
    public-key: classpath:certs/public.pem
  jwt:
    access-ttl-minutes: 15
    refresh-ttl-days: 7
  storage:
    provider: ${APP_STORAGE_PROVIDER:local}
    local-dir: ./storage
    google-drive:
      folder-id: ${APP_STORAGE_GOOGLE_DRIVE_FOLDER_ID:}
      credentials-file: ${APP_STORAGE_GOOGLE_DRIVE_CREDENTIALS_FILE:}
      client-id: ${APP_STORAGE_GOOGLE_DRIVE_CLIENT_ID:}
      client-secret: ${APP_STORAGE_GOOGLE_DRIVE_CLIENT_SECRET:}
      refresh-token: ${APP_STORAGE_GOOGLE_DRIVE_REFRESH_TOKEN:}
  cookie:
    # Refresh-token cookie Secure flag. false for local http dev (no active
    # profile infra exists yet - see BUG-C01 commit); MUST be true behind HTTPS
    # in any real deployment.
    secure: false
