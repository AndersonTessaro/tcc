spring:
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 51MB
  application:
    name: harmonia
  datasource:
    url: jdbc:postgresql://localhost:5432/harmonia
    username: harmonia
    password: harmonia
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  docker:
    compose:
      # Resolved against the working dir, which is harmonia-app/ under spring-boot:run and the IDE.
      file: ../../docker-compose.yml

server:
  tomcat:
    max-swallow-size: 60MB

app:
  rsa:
    private-key: classpath:certs/private.pem
    public-key: classpath:certs/public.pem
  jwt:
    access-ttl-minutes: 15
    refresh-ttl-days: 7
  storage:
    local-dir: ./storage
  cookie:
    # Refresh-token cookie Secure flag. false for local http dev (no active
    # profile infra exists yet - see BUG-C01 commit); MUST be true behind HTTPS
    # in any real deployment.
    secure: false
