name: Build

# Stage 1: everything compiles and lints. No tests run here.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Maven reactor)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # JWT keys are gitignored, so CI mints its own throwaway pair.
      - name: Generate RSA keypair
        run: ./scripts/generate-jwt-keys.sh

      - name: Compile and install modules
        run: ./mvnw -B -ntp -DskipTests install

  frontend:
    name: Frontend (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace: [mobile, web]
    defaults:
      run:
        working-directory: ${{ matrix.workspace }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ matrix.workspace }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build web bundle
        if: matrix.workspace == 'web'
        run: npm run build
