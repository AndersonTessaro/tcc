name: Unit tests

# Stage 2: fast, isolated tests.
#   backend - Surefire (*Test): lesson-core domain rules + harmonia-app use cases
#   mobile  - jest project "unit" (everything outside src/app)
#   web     - vitest, integration suites excluded
on:
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    name: Backend unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Generate RSA keypair
        run: ./scripts/generate-jwt-keys.sh

      - name: Run Surefire tests
        run: ./mvnw -B -ntp test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports-backend
          path: backend/*/target/surefire-reports/
          if-no-files-found: ignore

  frontend:
    name: ${{ matrix.workspace }} unit tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace: [mobile, web]
    defaults:
      run:
        working-directory: ${{ matrix.workspace }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ matrix.workspace }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit
