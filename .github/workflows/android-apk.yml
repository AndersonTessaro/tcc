name: Android APK

# Manual: release APK of the mobile app, pointing at the API in mobile/.env.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      # Release is signed with the template's debug.keystore, the same one local prebuilds use,
      # so the APK installs over a previous one without uninstalling.
      - name: Generate native project
        run: npx expo prebuild -p android --no-install

      - name: Assemble release
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: sonetto-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
